name: Automation Tests

on:
  schedule:
    - cron: '0 7 * * *'
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run mode (no deletions)'
        required: true
        default: 'true'

jobs:
  ensure-company-core:
    runs-on: ubuntu-latest
    
    steps:
      - name: Ensure Ciklum exists in company core
        env:
          SOLR_AUTH: ${{ secrets.SOLR_AUTH }}
        run: |
          CIF="45871772"
          EXPECTED_FIELDS='["company","brand","status","location","website","career","lastScraped","scraperFile"]'

          EXISTING_DOC=$(curl -s --user "${SOLR_AUTH}" \
            "https://solr.peviitor.ro/solr/company/select?q=id:${CIF}&rows=1" | jq '.response.docs[0] // empty')

          if [ -z "$EXISTING_DOC" ]; then
            echo "Ciklum not found in company core - adding..."
            NEEDS_PUSH=true
          else
            MISSING=$(echo "$EXISTING_DOC" | jq --argjson fields "$EXPECTED_FIELDS" --argjson doc "$EXISTING_DOC" '
              $fields | map(select(. as $f | $doc | has($f) | not))')
            NEEDS_PUSH=false
            if [ "$MISSING" != "[]" ]; then
              echo "Ciklum missing fields: ${MISSING} - updating..."
              NEEDS_PUSH=true
            else
              echo "Ciklum has all expected fields - no update needed"
            fi
          fi

          if [ "$NEEDS_PUSH" = true ]; then
            echo '[{"id":"45871772","company":"CIKLUM ROMANIA SRL","brand":"Ciklum","status":"activ","location":["Bucuresti"],"website":["https://www.ciklum.com"],"career":["https://explore-jobs.ciklum.com"],"lastScraped":"2026-07-10","scraperFile":"https://raw.githubusercontent.com/sebiboga/ciklum-romania-srl-nodejs-scraper/master/.github/workflows/job-seeker-ro-spider.yml"}]' > company_data.json

            echo "Upserting Ciklum to company core..."
            curl -s --user "${SOLR_AUTH}" \
              "https://solr.peviitor.ro/solr/company/update/json?commit=true" \
              -X POST \
              -H "Content-Type: application/json" \
              --data-binary @company_data.json
          fi

  Automation-Tests:
    runs-on: ubuntu-latest
    needs: ensure-company-core
    
    steps:
      - uses: actions/checkout@v5
        
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          
      - name: Install dependencies
        run: npm install

      - name: Run Unit Tests
        run: |
          npm run test:unit
          mv test-report.html test-results-unit.html
        env:
          SOLR_AUTH: ${{ secrets.SOLR_AUTH }}
          
      - name: Upload Unit Test Results
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-results
          path: test-results-unit.html
          retention-days: 30

      - name: Run Integration Tests
        run: |
          npm run test:integration
          mv test-report.html test-results-integration.html
        env:
          SOLR_AUTH: ${{ secrets.SOLR_AUTH }}
          
      - name: Upload Integration Test Results
        uses: actions/upload-artifact@v7
        with:
          name: integration-test-results
          path: test-results-integration.html
          retention-days: 30

      - name: Run E2E Tests
        run: |
          npm run test:e2e
          mv test-report.html test-results-e2e.html
        env:
          SOLR_AUTH: ${{ secrets.SOLR_AUTH }}
          
      - name: Upload E2E Test Results
        uses: actions/upload-artifact@v7
        with:
          name: e2e-test-results
          path: test-results-e2e.html
          retention-days: 30
